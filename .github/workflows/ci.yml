name: ConservationCI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web run typecheck
      - run: pnpm --dir web run lint
      - run: pnpm --dir web test
      - run: pnpm --dir web run build
      - name: Generate fresh scientific fixtures
        run: target/release/conservationci fixtures generate --output /tmp/conservationci-fixtures
      - name: Passing conservation gate
        run: |
          target/release/conservationci check --input /tmp/conservationci-fixtures/analytic.csv --config examples/models/conservative.toml --report-json analytic-report.json --report-md analytic-report.md --github-annotations
      - name: Verify expected failure and retain evidence
        shell: bash
        run: |
          set +e
          target/release/conservationci check --input /tmp/conservationci-fixtures/euler.csv --config examples/models/conservative.toml --report-json euler-report.json --report-md euler-report.md --samples-csv euler-samples.csv
          code=$?
          set -e
          test "$code" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conservation-reports
          path: |
            *-report.json
            *-report.md
            *-samples.csv
